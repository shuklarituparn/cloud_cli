name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release tests
        run: go test -race -count=1 ./...

      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          package="github.com/shuklarituparn/cloud_cli/internal/buildinfo"
          ldflags="-s -w -X ${package}.Version=${VERSION} -X ${package}.Commit=${COMMIT} -X ${package}.Date=${build_date}"

          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64 \
            windows/amd64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            extension=""
            if [ "$goos" = "windows" ]; then
              extension=".exe"
            fi

            output="dist/cloud_cli-${VERSION}-${goos}-${goarch}${extension}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "$output" ./cmd/cloud_cli
          done

          (
            cd dist
            sha256sum cloud_cli-* > checksums.txt
          )

      - name: Verify Linux release binary
        shell: bash
        run: |
          set -euo pipefail
          ./dist/cloud_cli-${GITHUB_REF_NAME}-linux-amd64 version

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --generate-notes \
            --verify-tag \
            --title "${GITHUB_REF_NAME}"
